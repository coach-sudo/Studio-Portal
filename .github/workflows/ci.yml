name: Production checks

on:
  push:
    branches: [main]
  pull_request:
    branches:
      [
        main,
        codex/credit-coverage-diagnostics,
        codex/credit-lifecycle-reliability,
        codex/occurrence-safe-lesson-changes,
        codex/bulk-lesson-management,
        codex/bulk-lesson-interface,
        codex/student-workspace-experience,
        codex/pr2-query-layer,
        codex/pr5-server-contracts,
        codex/pr6-product-polish,
        codex/pr7-performance-styles,
        codex/product-design-modernization,
      ]

permissions:
  contents: read

concurrency:
  group: studio-portal-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check:secrets
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - name: Build production-shaped browser bundle
        env:
          VITE_SUPABASE_URL: https://ci.example.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_ci_example
          VITE_QUERY_LAYER_V2: "false"
        run: npm run build
      - run: npm run bundle:check -- --require-configured-client
      - name: Upload failed build and test evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            dist/
            test-results/
            playwright-report/

  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Upgrade from verified production migration baseline with synthetic history
        env:
          WAVE_ONE_ACCEPTANCE_LOCAL: "true"
        run: node scripts/test-wave-one-upgrade.mjs
      - run: npx supabase db reset --local --no-seed
      - run: npx supabase db lint --local --schema public,credit_internal,lesson_ops,workspace_internal --fail-on error
      - run: npm run supabase:types
      - run: npx supabase test db
      - run: node scripts/test-credit-concurrency.mjs
      - run: node scripts/test-lesson-change-concurrency.mjs
      - run: node scripts/test-lesson-bulk-concurrency.mjs
      - run: node scripts/test-material-study-concurrency.mjs
      - run: node scripts/test-provider-intake-concurrency.mjs
      - run: git diff --exit-code -- src/types/database.generated.ts
      - name: Retain migration verification evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: migration-evidence-${{ github.run_id }}
          if-no-files-found: ignore
          path: src/types/database.generated.ts
      - if: always()
        run: npx supabase stop --no-backup
